name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Resolve tag
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve_tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${{ steps.resolve_tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build dmg (arm64)
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Build dmg (x64)
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Verify app signatures are intact
        run: |
          codesign --verify --deep --strict "dist/mac-arm64/PDF Tools.app"
          codesign --verify --deep --strict "dist/mac/PDF Tools.app"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          body: |
            This build is **not code-signed or notarized**.

            If you download the `.dmg` directly (i.e. not via Homebrew), macOS Gatekeeper will likely refuse to open it with a "damaged" or "unidentified developer" warning. On macOS 15 (Sequoia) and later, open **System Settings → Privacy & Security**, scroll down to the notice about the blocked app, and click **Open Anyway** (confirm once). On older macOS versions, right-click (or Control-click) the app in `/Applications` and choose **Open** instead.

            If neither shows an override option (the "move to Trash" variant of the warning), run `xattr -dr com.apple.quarantine "/Applications/PDF Tools.app"` in Terminal instead.

      # Auto-update the Homebrew Cask in the pravinbashyal/homebrew-pdf-tools tap
      # so `brew upgrade --cask pdf-tools` picks up this release without manual
      # editing. Requires a `HOMEBREW_TAP_TOKEN` repo secret: a token with write
      # access to homebrew-pdf-tools (a fine-grained PAT scoped to just that repo,
      # with Contents: Read and write, is recommended over a classic PAT). Set it
      # at https://github.com/pravinbashyal/pdf-tools/settings/secrets/actions.
      - name: Checkout homebrew-pdf-tools tap
        uses: actions/checkout@v4
        with:
          repository: pravinbashyal/homebrew-pdf-tools
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-pdf-tools

      - name: Update Homebrew Cask formula
        run: |
          set -euo pipefail

          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          ARM_DMG="$(ls dist/*-arm64.dmg)"
          X64_DMG="$(ls dist/*-x64.dmg)"
          ARM_SHA="$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')"
          X64_SHA="$(shasum -a 256 "$X64_DMG" | awk '{print $1}')"

          python3 - "$VERSION" "$ARM_SHA" "$X64_SHA" homebrew-pdf-tools/Casks/pdf-tools.rb <<'PYEOF'
          import re
          import sys

          version, arm_sha, x64_sha, path = sys.argv[1:5]

          with open(path) as f:
              content = f.read()

          content, n = re.subn(r'version "[^"]*"', f'version "{version}"', content, count=1)
          if n != 1:
              raise SystemExit(f"expected exactly 1 replacement for version, got {n}")

          def replace_block_sha(content, block_name, new_sha):
              pattern = re.compile(
                  r'(on_' + block_name + r' do\n\s*sha256 ")[a-f0-9]{64}(")'
              )
              new_content, count = pattern.subn(r'\g<1>' + new_sha + r'\g<2>', content)
              if count != 1:
                  raise SystemExit(f"expected exactly 1 replacement for on_{block_name} sha256, got {count}")
              return new_content

          content = replace_block_sha(content, "arm", arm_sha)
          content = replace_block_sha(content, "intel", x64_sha)

          with open(path, "w") as f:
              f.write(content)
          PYEOF

          cd homebrew-pdf-tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pdf-tools.rb
          if git diff --cached --quiet; then
            echo "No changes to Cask formula; skipping commit."
          else
            git commit -m "Update pdf-tools to v${VERSION}"
            git push origin main
          fi
